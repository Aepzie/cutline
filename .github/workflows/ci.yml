name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm fixtures
      - run: pnpm test
      - run: pnpm build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t cutline:ci .
      - name: Start container and check health + editor
        run: |
          docker run -d --name cutline -p 127.0.0.1:4100:4100 cutline:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4100/api/health && break
            sleep 2
          done
          curl -fsS http://localhost:4100/api/health | grep -q '"ffmpeg":"'
          curl -fsS http://localhost:4100/ | grep -q '<div id="root">'
          curl -fsS -X POST -H 'content-type: application/json' \
            -d '{"name":"Docker smoke"}' http://localhost:4100/api/projects | grep -q '"proj_'
      - name: Container logs
        if: always()
        run: docker logs cutline || true

  e2e:
    name: Playwright smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm fixtures
      - run: pnpm --filter @cutline/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
