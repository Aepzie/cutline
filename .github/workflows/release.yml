name: Release

# Releases are cut by pushing a version tag (vX.Y.Z) after a release PR that ran
# `pnpm version-packages` (Changesets) and updated CHANGELOG.md was merged.
# The GitHub Release notes are taken from that version's CHANGELOG.md section.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md section for $version" >&2
            exit 1
          fi
      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "Cutline $GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
